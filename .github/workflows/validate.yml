name: Validate curation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curation:
    name: Curation contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository invariants
        run: node .github/scripts/validate-curation.mjs

      - name: Verify searchable catalog
        run: node scripts/build-catalog.mjs --check

      - name: Test catalog generation and search
        run: node --test tests/*.test.mjs

      - name: Test semantic audit rules
        run: node .github/scripts/validate-curation.mjs --self-test

      - name: Validate Awesome list format
        run: npx --yes awesome-lint@2.3.0 README.md

      - name: Audit arXiv metadata
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node .github/scripts/validate-curation.mjs --arxiv

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md' './**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
